[project]
name = "quantbt"
version = "0.1.0"
description = "A small event-driven backtesting library with risk metrics"
requires-python = ">=3.10"
dependencies = ["numpy", "pandas"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
quantbt = "quantbt.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
